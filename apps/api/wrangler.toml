name = "echo-grid-feedback-api"
main = "src/index.ts"
compatibility_date = "2026-07-08"
# global_fetch_strictly_public: without it, *.workers.dev subdomains are
# treated as "private" and a Worker-to-Worker fetch between two of them
# (here, apps/web's Server Actions calling this API) throws Cloudflare error
# 1042. Needed on both this Worker and apps/web's until a custom domain
# replaces workers.dev for both -- then this becomes unnecessary but is safe
# to leave in place.
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# RESOLVED: Cloudflare's Free Workers plan has a hard, non-configurable
# 10ms CPU-time limit per request invocation, which 600k-iteration PBKDF2
# password hashing (auth/password.ts) blew through, causing every real
# /auth/signup and /auth/login to fail with Cloudflare error 1102. Fixed
# by moving the actual hashing compute into a Durable Object (see
# auth/password-hasher.do.ts, auth/pbkdf2-worker.ts) -- a Worker calling a
# Durable Object's fetch() counts as I/O wait for the caller, not CPU time,
# and the Durable Object gets its own separate 30s default CPU budget.
# SQLite-backed Durable Objects (below) are available on the Free plan, so
# this needed no Workers Paid upgrade and no PBKDF2 iteration reduction.
[[durable_objects.bindings]]
name = "PASSWORD_HASHER"
class_name = "PasswordHasherDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PasswordHasherDurableObject"]

[vars]
# Flipped to "production" 2026-08-05 -- Twilio and Resend now have real
# credentials (see .dev.vars comments / memory), so ConsoleSmsService and
# ConsoleEmailService should no longer substitute for them. Stripe is
# unaffected by this flag either way -- billing/stripe-client.ts always
# calls the real Stripe API regardless of ENVIRONMENT, gated only by
# whether STRIPE_SECRET_KEY is a real key (still a placeholder as of this
# change -- Stripe setup is paused, see memory).
ENVIRONMENT = "production"
# Anthropic model identifier -- non-secret, [vars] not [secrets] so it's
# swappable without a deploy. claude-sonnet-5 confirmed as the current, real
# model string via Anthropic's own docs (platform.claude.com/docs, checked
# 2026-07-11) -- a balanced choice for SummaryService's period-summary +
# recommendation generation (real prose quality matters, but this isn't a
# task that needs Opus-level reasoning). Re-confirm against Anthropic's docs
# before changing environments, since model identifiers do change over time.
ANTHROPIC_MODEL = "claude-sonnet-5"
# Resend sender identity (Notifications Block 2) -- non-secret, one
# platform-wide "from" address for v1. echo-grid.uk verified in Resend as of
# 2026-08-05 (INFINICUS team account) -- real address, not a placeholder.
RESEND_FROM_ADDRESS = "Echo Grid <notifications@echo-grid.uk>"
# CORS allow-list for apps/web's deployed origin(s), comma-separated --
# read by index.ts's cors() middleware (config/env.ts's Bindings). Only
# matters for direct browser-to-API calls; today's Server Actions (BFF
# pattern, api-client.ts) run server-side on the web Worker and never hit
# this check. echo-grid.uk added alongside (not instead of) the workers.dev
# origins so both keep working during the domain cutover.
ALLOWED_ORIGINS = "http://localhost:3000,https://echo-grid.uk,https://echo-grid-feedback-web.katohuzairu122.workers.dev"

# Required secrets -- set with `wrangler secret put <NAME>` (never stored here).
# Validated automatically by `wrangler dev` / `wrangler deploy`. See .dev.vars.example
# for local development.
[secrets]
required = [
  "JWT_ACCESS_SECRET",
  "JWT_REFRESH_SECRET",
  "CUSTOMER_JWT_SECRET",
  "TWILIO_ACCOUNT_SID",
  "TWILIO_AUTH_TOKEN",
  "TWILIO_FROM_NUMBER",
  "ANTHROPIC_API_KEY",
  "RESEND_API_KEY",
  "STRIPE_SECRET_KEY",
  "STRIPE_WEBHOOK_SECRET",
]

# Postgres (Neon) via Hyperdrive -- the connection string lives in Cloudflare's
# Hyperdrive config, never in this file or in a Worker secret. Provision with:
#   npx wrangler hyperdrive create echo-grid-feedback-db --connection-string="postgresql://..."
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "542dd173d3d14d54ac66c0f1f69e5ff9"
# RESOLVED (2026-07-30): query caching was DISABLED on this Hyperdrive
# config via `wrangler hyperdrive update <id> --caching-disabled`. Hyperdrive
# caches read queries for 60s by default and does NOT invalidate on write --
# this broke read-after-write everywhere a create was immediately followed
# by a list/find (most visibly: a brand-new user's first "create your
# business" submission kept re-showing the create form, since GET
# /businesses served the cached pre-creation empty result; same root cause
# behind an earlier "login right after signup fails" finding, via
# findByEmail's own pre-existence-check caching an empty result). This
# config change isn't expressed in this file -- it's a property of the
# Hyperdrive resource itself, not a wrangler.toml setting. If read-heavy,
# staleness-tolerant caching is wanted later (e.g. public business lookups,
# analytics), add a SECOND Hyperdrive binding with caching left enabled for
# just those specific queries, per Cloudflare's own documented pattern --
# don't re-enable it here without solving read-after-write first.
# Do NOT add `localConnectionString` here -- this file is tracked by git and
# already pushed to GitHub. It is not needed for migrations or integration
# tests (those connect directly via DATABASE_URL from apps/api/.env, never
# through Hyperdrive). It is only used by `wrangler dev` to proxy Hyperdrive
# locally; if that's ever needed, set it via a local, gitignored mechanism
# (.dev.vars or a shell env var), never by editing this file.
# Object storage for receipts, exports, and other business-uploaded files.
# QR codes are rendered client-side from a token + known URL (no server-side
# image generation/storage -- see README's QR Engagement section), so this
# bucket is never used for QR images. Provision with:
#   npx wrangler r2 bucket create echo-grid-feedback-uploads
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "echo-grid-feedback-uploads"

# Cache / session support. Provision with:
#   npx wrangler kv namespace create CACHE
[[kv_namespaces]]
binding = "CACHE"
id = "5cf62e12f7d940e2b70a0e453463ec90"

# Async job queue (sentiment analysis, notifications, loyalty recalculation).
# Consumer handler wired up in Sentiment Analytics Block 2 (src/index.ts's
# `queue` export). Provision with:
#   npx wrangler queues create echo-grid-feedback-jobs
[[queues.producers]]
binding = "JOBS"
queue = "echo-grid-feedback-jobs"

[[queues.consumers]]
queue = "echo-grid-feedback-jobs"
max_batch_size = 10
max_retries = 3
# Sends a message to this queue (by name) after 3 failed attempts, instead of
# dropping it -- classification failures already degrade gracefully to
# analysis_status='failed' on the row itself (see sentiment.service.ts), but
# a DLQ still exists so a systemic failure (e.g. Workers AI outage) is
# visible/inspectable rather than silently absorbed by that per-row fallback.
# Provision with: npx wrangler queues create echo-grid-feedback-jobs-dlq
dead_letter_queue = "echo-grid-feedback-jobs-dlq"

# Workers AI -- native binding, not a provisioned resource with an ID (no
# `wrangler ai create` step). Powers per-item sentiment classification only
# (sentiment/sentiment-classifier.ts); see AI Standards in project
# instructions for why LLM-backed summarization (Block 3) is a separate,
# explainable async path rather than folded into this binding.
[ai]
binding = "AI"

# Native Rate Limiting binding (not Durable Objects -- see middleware/rate-limit.ts
# for why). namespace_id is an arbitrary account-unique label you define yourself,
# not something to provision via CLI. period must be 10 or 60 (Cloudflare limitation).
[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1002"
[ratelimits.simple]
limit = 300
period = 60

# Guards the anonymous QR/feedback surface (qr.routes.ts). Stacks on top of
# API_RATE_LIMITER, same pattern as AUTH_RATE_LIMITER on /auth/*. 20/min/IP
# is a reasonable starting estimate, not derived from real traffic data --
# revisit once production usage patterns are known.
[[ratelimits]]
name = "PUBLIC_RATE_LIMITER"
namespace_id = "1003"
[ratelimits.simple]
limit = 20
period = 60

# Guards SMS OTP requests (customer-auth.routes.ts) -- deliberately much
# stricter than PUBLIC_RATE_LIMITER: each successful request costs real money
# (one Twilio SMS), so the abuse budget is a small fraction of the free
# feedback-submission surface. 3/min/IP is a starting estimate.
[[ratelimits]]
name = "OTP_RATE_LIMITER"
namespace_id = "1004"
[ratelimits.simple]
limit = 3
period = 60

# Guards the AI follow-up-question endpoint (qr.routes.ts) -- deliberately
# separate from PUBLIC_RATE_LIMITER: every successful call here is a real
# Anthropic API charge, unlike a free feedback submission or a rate-limited
# retry against it. Same reasoning as OTP_RATE_LIMITER, scaled to this
# feature's expected volume (one call per customer per submission normally,
# so the budget only needs to absorb retries/abuse, not legitimate repeats).
[[ratelimits]]
name = "FOLLOWUP_QUESTION_RATE_LIMITER"
namespace_id = "1005"
[ratelimits.simple]
limit = 5
period = 60

# Cron triggers -- fire the `scheduled` export (src/index.ts, Sentiment
# Analytics Block 3), which enqueues one generate_summary job per business
# per period. Business-wide only (branchId null) for now; per-branch
# auto-summaries are a documented future extension the schema already
# supports (feedback_summaries.branchId is nullable), not a missing feature.
# The */5 entry is unrelated to summaries -- it's the critical-incident
# escalation sweep (Automated Feedback Sorting), see index.ts's
# CRITICAL_ESCALATION_CRON constant, which this literal string must match.
[triggers]
crons = [
  "0 0 * * 1",  # weekly -- every Monday 00:00 UTC
  "0 0 1 * *",  # monthly -- 1st of the month, 00:00 UTC
  "*/5 * * * *",  # every 5 minutes -- critical-incident escalation sweep
]

[observability]
enabled = true

[dev]
port = 8787