<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline · Echo Grid</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #ffffff;
        color: #111827;
      }
      .mark {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #10b981;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0;
      }
      p {
        margin: 0;
        color: #6b7280;
        max-width: 28rem;
      }
      button {
        margin-top: 0.5rem;
        padding: 0.6rem 1.25rem;
        border-radius: 8px;
        border: none;
        background: #10b981;
        color: #ffffff;
        font-size: 0.95rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="mark">
      <svg width="28" height="28" viewBox="0 0 20 20" fill="none">
        <circle cx="6" cy="8" r="2.2" fill="#ffffff" />
        <circle cx="14" cy="8" r="2.2" fill="#ffffff" />
        <circle cx="10" cy="14" r="2.2" fill="#ffffff" />
        <line x1="6" y1="8" x2="10" y2="14" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.7" />
        <line x1="14" y1="8" x2="10" y2="14" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.7" />
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Echo Grid needs a connection to load your dashboard. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
