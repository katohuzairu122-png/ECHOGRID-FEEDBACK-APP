packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
  - "@swc/core"
  - "@parcel/watcher"

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
  "@swc/core": true
  "@parcel/watcher": true

overrides:
  browserslist: 4.28.7
  "source-map-js@>=1.0.0 <1.2.2": ">=1.2.2"

# TEMPORARY audit exemption (owner-approved scope: this one advisory only; everything else still fails the gate at --audit-level high).
