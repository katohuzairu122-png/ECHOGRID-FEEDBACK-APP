# Reachable only as picomatch@4.0.5 via next-intl > @parcel/watcher (a dev/build-time source-file watcher). Verified 2026-11-17:
# not present in the production web server trace (.next) nor the API Worker dry-run bundle.
# REMOVE this block and add the override "picomatch@<4.0.8": ">=4.0.8" once picomatch 4.0.8 is published. Review by 2026-12-17.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
