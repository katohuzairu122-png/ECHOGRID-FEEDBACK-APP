name: Configure staging core secrets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/configure-staging-core-secrets.yml

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate and store isolated staging secrets
        working-directory: apps/api
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for name in \
            JWT_ACCESS_SECRET \
            JWT_REFRESH_SECRET \
            CUSTOMER_JWT_SECRET \
            QR_TOKEN_SECRET \
            FRAUD_DETECTION_SALT
          do
            openssl rand -base64 48 | tr -d '\n' | \
              pnpm exec wrangler secret put "$name" --env staging
          done
