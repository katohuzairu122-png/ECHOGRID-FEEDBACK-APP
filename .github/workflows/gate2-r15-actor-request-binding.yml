name: Gate 2 R15 offline actor request binding

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate2-r15-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Offline actor-to-request security contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject runtime credential usage in offline tests
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/api/scripts/gate2-r15-actor-request-binding.test.mjs
          ! grep -Eq 'process\.env\.(DATABASE_URL|HYPERDRIVE|STRIPE_SECRET_KEY|JWT_ACCESS_SECRET)' apps/api/scripts/gate2-r15-actor-request-binding.test.mjs
      - name: Run bounded actor request authorization proofs
        run: node --test apps/api/scripts/gate2-r15-actor-request-binding.test.mjs
