name: Gate 2 B2 disposable signed session broker
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gate2-b2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: PostgreSQL 18 signed actor and session broker proof
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: echogrid
          POSTGRES_PASSWORD: echogrid
          POSTGRES_DB: echogrid_ci_pg18_b2_broker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://echogrid:echogrid@localhost:5432/echogrid_ci_pg18_b2_broker
      GATE2_B2_DISPOSABLE: I_ACKNOWLEDGE_DISPOSABLE_PG18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Guard isolated PostgreSQL target
        shell: bash
        run: |
          set -euo pipefail
          test "$DATABASE_URL" = 'postgresql://echogrid:echogrid@localhost:5432/echogrid_ci_pg18_b2_broker'
          test "$GATE2_B2_DISPOSABLE" = 'I_ACKNOWLEDGE_DISPOSABLE_PG18'
          test "$(PGPASSWORD=echogrid psql -h localhost -U echogrid -d echogrid_ci_pg18_b2_broker -Atc "SELECT current_setting('server_version_num')::int / 10000")" = 18
      - name: Verify repository migration chain
        run: pnpm --filter @echo-grid-feedback/api db:check
      - name: Replay migrations on disposable PG18
        run: pnpm --filter @echo-grid-feedback/api db:migrate
      - name: Verify signed actor/session/tenant/branch broker
        working-directory: apps/api
        run: node scripts/gate2-b2-disposable-signed-session-broker.mjs
