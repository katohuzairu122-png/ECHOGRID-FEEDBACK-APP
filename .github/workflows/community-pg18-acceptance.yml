name: Community PG18 acceptance (disposable)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/community-pg18-acceptance.yml'
      - 'apps/api/src/community/**'
      - 'apps/api/test/integration/community-*.integration.test.ts'
      - 'apps/api/drizzle/**'
      - 'apps/api/test/integration/network-draft-publication.integration.test.ts'
      - 'apps/api/src/network/**'
      - 'apps/api/src/platform/network-*'
      - 'apps/web/src/app/platform/network-moderation/**'
      - 'apps/web/src/app/loyalty/dashboard/community/**'
      - 'apps/web/messages/*/loyalty.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-pg18-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: echogrid
          POSTGRES_PASSWORD: echogrid
          POSTGRES_DB: community_pg18_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U echogrid -d community_pg18_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://echogrid:echogrid@localhost:5432/community_pg18_disposable
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Initialize disposable database from existing migrations
        run: pnpm --filter @echo-grid-feedback/api db:migrate
      - name: Seed base data required by the Community integration suites
        run: |
          pnpm --filter @echo-grid-feedback/api db:seed
          pnpm --filter @echo-grid-feedback/api db:seed:plans
      - name: Community and Network integration suites on PostgreSQL 18 (non-browser)
        run: pnpm --filter @echo-grid-feedback/api exec vitest run --config vitest.integration.config.ts test/integration/community test/integration/network
      - name: Build web for real Server Actions
        run: pnpm --filter @echo-grid-feedback/web build
      - name: Install Chromium
        run: pnpm --filter @echo-grid-feedback/api exec playwright install --with-deps chromium
      - name: Community and Network real-Chromium journeys on PostgreSQL 18
        run: pnpm --filter @echo-grid-feedback/api exec vitest run --config vitest.integration.config.ts test/integration/network-draft-publication.integration.test.ts -t "browser"
        env:
          NETWORK_LIFECYCLE_BROWSER: "true"
