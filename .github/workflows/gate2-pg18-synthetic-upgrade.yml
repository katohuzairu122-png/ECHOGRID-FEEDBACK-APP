name: Gate 2 PG18 seeded backup and 45-to-67 upgrade

# Purely disposable PostgreSQL 18 Actions service container.
# Does not access Neon, Stripe, Cloudflare, secrets or persistent databases.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate2-pg18-fixture-backup-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: PG18 synthetic prefix and 22-migration upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: echogrid
          POSTGRES_PASSWORD: echogrid
          POSTGRES_DB: echogrid_ci_pg18_upgrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://echogrid:echogrid@localhost:5432/echogrid_ci_pg18_upgrade
      GATE2_SYNTHETIC_UPGRADE: I_ACKNOWLEDGE_DISPOSABLE_PG18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify PostgreSQL 18 isolated target and repository journal
        shell: bash
        run: |
          set -euo pipefail
          test "$DATABASE_URL" = 'postgresql://echogrid:echogrid@localhost:5432/echogrid_ci_pg18_upgrade'
          test "$GATE2_SYNTHETIC_UPGRADE" = 'I_ACKNOWLEDGE_DISPOSABLE_PG18'
          test "$(PGPASSWORD=echogrid psql -h localhost -U echogrid -d echogrid_ci_pg18_upgrade -Atc "SELECT current_setting('server_version_num')::int / 10000")" = '18'
          git diff --quiet -- apps/api/drizzle/meta/_journal.json
      - name: Generate 45-entry journal in disposable CI workspace
        working-directory: apps/api
        run: node scripts/gate2-pg18-prefix-upgrade.mjs prepare
      - name: Apply first 45 migrations to disposable PostgreSQL 18
        run: pnpm --filter @echo-grid-feedback/api db:migrate
      - name: Verify exact 45-migration prefix and absence of future schema
        working-directory: apps/api
        run: node scripts/gate2-pg18-prefix-upgrade.mjs verify-prefix
      - name: Seed two synthetic tenants and isolated loyalty memberships
        working-directory: apps/api
        run: node scripts/gate2-pg18-fixture-evidence.mjs seed
      - name: Backup the 45-migration synthetic database with PG18 client
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v "$RUNNER_TEMP:/backup" \
            -e PGPASSWORD=echogrid \
            postgres:18 pg_dump -h localhost -p 5432 -U echogrid \
            -d echogrid_ci_pg18_upgrade -Fc -f /backup/gate2-r4.dump
          test -s "$RUNNER_TEMP/gate2-r4.dump"
      - name: Restore backup to a second disposable PostgreSQL 18 database
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host -e PGPASSWORD=echogrid postgres:18 \
            createdb -h localhost -p 5432 -U echogrid echogrid_ci_pg18_restored
          docker run --rm --network host \
            -v "$RUNNER_TEMP:/backup:ro" -e PGPASSWORD=echogrid \
            postgres:18 pg_restore -h localhost -p 5432 -U echogrid \
            -d echogrid_ci_pg18_restored --no-owner /backup/gate2-r4.dump
      - name: Verify restored tenant fixtures and pre-upgrade migration history
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://echogrid:echogrid@localhost:5432/echogrid_ci_pg18_restored
        run: node scripts/gate2-pg18-fixture-evidence.mjs verify-prefix
      - name: Restore exact immutable repository journal
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD:apps/api/drizzle/meta/_journal.json > apps/api/drizzle/meta/_journal.json
          git diff --exit-code -- apps/api/drizzle/meta/_journal.json
      - name: Apply pending migrations 45 through 71 to disposable PostgreSQL 18
        run: pnpm --filter @echo-grid-feedback/api db:migrate
      - name: Verify 72-migration history, forced RLS, and financial-denial guards
        working-directory: apps/api
        run: node scripts/gate2-pg18-prefix-upgrade.mjs verify-full
      - name: Verify synthetic tenant and loyalty rows survived upgrade
        working-directory: apps/api
        run: node scripts/gate2-pg18-fixture-evidence.mjs verify
