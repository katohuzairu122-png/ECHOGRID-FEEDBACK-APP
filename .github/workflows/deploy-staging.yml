name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full main-branch commit SHA to deploy
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_STAGING
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API then web to staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify reviewed commit and confirmation
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          DISPATCH_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$CONFIRMATION" = "DEPLOY_STAGING"
          test "$DISPATCH_REF" = "refs/heads/main"
          test "$RUN_SHA" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          : "${CLOUDFLARE_API_TOKEN:?Configure CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Configure CLOUDFLARE_ACCOUNT_ID}"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @echo-grid-feedback/api build

      - name: Build web and cashier once (OpenNext)
        working-directory: apps/web
        run: pnpm exec opennextjs-cloudflare build

      - name: Verify staging migration state (read only)
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm --filter @echo-grid-feedback/api db:verify:production

      - name: Reject superseded staging build
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_COMMIT"
          echo "Staging release commit: $EXPECTED_COMMIT" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy API to staging
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --env staging

      - name: Deploy web to staging
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec opennextjs-cloudflare deploy --env staging

      # CASHIER-PWA-DEPLOY-01: the dedicated staging cashier Worker, deployed from the SAME build artifact the web step just
      # produced (no rebuild). Staging only; production Workers, domains and databases are not touched.
      - name: Deploy dedicated cashier Worker to staging
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec opennextjs-cloudflare deploy --env cashier-staging

      - name: Staging smoke
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            https://echo-grid-feedback-api-staging.katohuzairu122.workers.dev/health
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --output /dev/null \
            https://echo-grid-feedback-web-staging.katohuzairu122.workers.dev/

      - name: Cashier staging smoke (host isolation)
        shell: bash
        run: |
          set -euo pipefail
          CASHIER=https://echo-grid-feedback-cashier-staging.katohuzairu122.workers.dev
          WEB=https://echo-grid-feedback-web-staging.katohuzairu122.workers.dev
          curl --fail --silent --show-error --retry 5 --retry-all-errors --output /dev/null "$CASHIER/cashier/login"
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$CASHIER/manifest.webmanifest" | grep -q '"Echo Grid Cashier"'
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$WEB/cashier/login")" = "404"
          # Staff surfaces are never served on the cashier origin. /login, /signup and /forgot-password redirect to
          # /cashier in one hop; /dashboard and /platform first pass the staff middleware's own /login redirect
          # (unauthenticated), so a single-hop check was wrong for them. Follow the redirects and assert the FINAL
          # page is the cashier sign-in, served by the cashier host.
          for route in /login /signup /forgot-password /dashboard /platform; do
            final="$(curl --silent --show-error --location --max-redirs 5 --output /dev/null --write-out '%{url_effective} %{http_code}' "$CASHIER$route")"
            test "$final" = "$CASHIER/cashier/login 200"
          done
