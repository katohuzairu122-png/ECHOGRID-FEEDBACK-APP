name: Deploy production

# MANUAL, OWNER-AUTHORIZED PRODUCTION RELEASE (HETA-01-F1 B3). Merge to main runs CI only (ci-cd.yml) and deploys nothing.
#
# Model: code integration -> CI -> release authorization -> deployment -> post-deployment verification.
#   1. `authorize`  exact reviewed commit: full 40-hex SHA == the commit this run is bound to (github.sha) == the CURRENT tip of
#                   main; dispatch ref must be main; typed phrase. No secrets.
#   2. `verify`     the complete ci-cd.yml gate, called in this same run (never trusted from an earlier run).
#   3. `deploy-api`/`deploy-web`  run in the `production` GitHub environment. Independent approval comes from that
#                   environment's REQUIRED REVIEWERS, an owner-controlled repository setting (see
#                   docs/PRODUCTION-RELEASE.md). The typed phrase is a guard against typos, NOT approval: until required
#                   reviewers are configured this gate is code-ready but NOT certified as an independent approval. Each of the
#                   two deploy jobs references the environment, so each is expected to request its own review.
#   4. `block-2e..2h`  post-deployment runtime smoke and attestation, only for a release that deployed through this path.
# API and web are two separate Cloudflare deployments, not an atomic transaction (docs/PRODUCTION-RELEASE.md).
# Database migrations are NEVER run here; migrate-production.yml remains a separate authorization. A green release is not
# database certification.

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full reviewed main SHA (40 hex characters), must equal the current tip of main
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_PRODUCTION_RELEASE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  authorize:
    name: Authorize exact reviewed commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.bind.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bind release to the reviewed main commit
        id: bind
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
          DISPATCH_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "expected_commit must be a full 40-hex SHA"; exit 1; }
          [ "$CONFIRMATION" = "DEPLOY_PRODUCTION_RELEASE" ] || { echo "confirmation phrase mismatch"; exit 1; }
          [ "$DISPATCH_REF" = "refs/heads/main" ] || { echo "release must be dispatched from main"; exit 1; }
          [ "$RUN_SHA" = "$EXPECTED_COMMIT" ] || { echo "this run is bound to a different commit than expected_commit"; exit 1; }
          TIP="$(git rev-parse HEAD)"
          [ "$TIP" = "$EXPECTED_COMMIT" ] || { echo "expected_commit is not the current tip of main (stale or unreviewed)"; exit 1; }
          echo "commit=$EXPECTED_COMMIT" >> "$GITHUB_OUTPUT"

  verify:
    name: Required CI gate
    needs: authorize
    uses: ./.github/workflows/ci-cd.yml

  deploy-api:
    name: Deploy API to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: [authorize, verify]
    if: needs.verify.result == 'success'
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.commit }}
      - name: Confirm the checkout is the authorized commit
        shell: bash
        env:
          AUTHORIZED: ${{ needs.authorize.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$AUTHORIZED"
      # Evaluated after the reviewer approved. If main moved while the release waited, nothing has deployed yet, so fail closed
      # and require a fresh dispatch for the new tip. Deliberately NOT repeated in deploy-web: once the API has deployed, the pair
      # must complete from the same commit.
      - name: Confirm the authorized commit is still the tip of main (before anything deploys)
        shell: bash
        env:
          AUTHORIZED: ${{ needs.authorize.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [ "$(git rev-parse FETCH_HEAD)" = "$AUTHORIZED" ] || { echo "main advanced while this release waited; dispatch again for the new tip"; exit 1; }
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy
      - name: Record API release provenance
        if: always()
        shell: bash
        env:
          COMMIT: ${{ needs.authorize.outputs.commit }}
          OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        run: |
          mkdir -p provenance
          printf '{"worker":"api","commit":"%s","outcome":"%s","deploymentUrl":"%s","runId":"%s","actor":"%s","recordedAt":"%s"}\n' \
            "$COMMIT" "$OUTCOME" "$DEPLOY_URL" "$RUN_ID" "$ACTOR" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee provenance/api.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-provenance-api
          path: provenance/api.json

  deploy-web:
    name: Deploy web to Cloudflare Workers (OpenNext)
    runs-on: ubuntu-latest
    # API first, on purpose (web calls the API); web never deploys unless the API deployed from the same commit.
    needs: [authorize, verify, deploy-api]
    if: needs.deploy-api.result == 'success'
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.commit }}
      - name: Confirm the checkout is the authorized commit
        shell: bash
        env:
          AUTHORIZED: ${{ needs.authorize.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$AUTHORIZED"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy
        id: deploy
        working-directory: apps/web
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Record web release provenance
        if: always()
        shell: bash
        env:
          COMMIT: ${{ needs.authorize.outputs.commit }}
          OUTCOME: ${{ steps.deploy.outcome }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        run: |
          mkdir -p provenance
          printf '{"worker":"web","commit":"%s","outcome":"%s","runId":"%s","actor":"%s","recordedAt":"%s"}\n' \
            "$COMMIT" "$OUTCOME" "$RUN_ID" "$ACTOR" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee provenance/web.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-provenance-web
          path: provenance/web.json

  block-2e-runtime:
    name: Block 2E Runtime Hardening
    runs-on: ubuntu-latest
    needs: [authorize, deploy-web]
    if: needs.deploy-web.result == 'success'
    timeout-minutes: 10
    env:
      BLOCK15_API_URL: https://echo-grid-feedback-api.katohuzairu122.workers.dev
      BLOCK15_WEB_URL: https://echo-grid-feedback-web.katohuzairu122.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Block 2E static evidence
        uses: actions/download-artifact@v4
        with:
          name: block-2e-static-evidence
          path: .artifacts/block15

      - name: Runtime security verification
        run: pnpm block15:runtime
      - name: Bounded load smoke
        run: pnpm block15:load
      - name: Finalize Block 2E evidence
        run: pnpm block15:evidence
      - name: Upload Block 2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block-2e-evidence
          path: .artifacts/block15/
          if-no-files-found: error

  block-2f-release:
    name: Block 2F Deployment Operations
    runs-on: ubuntu-latest
    needs: [authorize, block-2e-runtime]
    if: needs.block-2e-runtime.result == 'success'
    timeout-minutes: 10
    env:
      BLOCK16_API_URL: https://echo-grid-feedback-api.katohuzairu122.workers.dev
      BLOCK16_WEB_URL: https://echo-grid-feedback-web.katohuzairu122.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Block 2F release inputs
        uses: actions/download-artifact@v4
        with:
          name: block-2f-release-inputs
          path: .artifacts/block16
      - name: Production deployment smoke
        run: pnpm block16:smoke
      - name: Finalize Block 2F evidence
        run: pnpm block16:evidence
      - name: Upload Block 2F release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block-2f-release-evidence
          path: .artifacts/block16/
          if-no-files-found: error

  block-2g-commercial:
    name: Block 2G Commercial Readiness
    runs-on: ubuntu-latest
    needs: [authorize, block-2f-release]
    if: needs.block-2f-release.result == 'success'
    timeout-minutes: 10
    env:
      BLOCK17_API_URL: https://echo-grid-feedback-api.katohuzairu122.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Block 2G static evidence
        uses: actions/download-artifact@v4
        with:
          name: block-2g-static-evidence
          path: .artifacts/block17
      - name: Verify production billing boundaries
        run: pnpm block17:verify
      - name: Finalize Block 2G evidence
        run: pnpm block17:evidence
      - name: Upload Block 2G commercial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block-2g-commercial-evidence
          path: .artifacts/block17/
          if-no-files-found: error

  block-2h-launch-readiness:
    name: Block 2H Launch Readiness
    runs-on: ubuntu-latest
    needs: [authorize, block-2g-commercial]
    if: needs.block-2g-commercial.result == 'success'
    timeout-minutes: 10
    env:
      BLOCK18_API_URL: https://echo-grid-feedback-api.katohuzairu122.workers.dev
      BLOCK18_WEB_URL: https://echo-grid-feedback-web.katohuzairu122.workers.dev
      BLOCK18_RELEASE_VERSION: v0.1.0-rc.1
      BLOCK18_GIT_COMMIT: ${{ needs.authorize.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Block 2D evidence
        uses: actions/download-artifact@v4
        with:
          name: block-2d-evidence
          path: .artifacts/imports/2d
      - name: Download Block 2E evidence
        uses: actions/download-artifact@v4
        with:
          name: block-2e-evidence
          path: .artifacts/imports/2e
      - name: Download Block 2F evidence
        uses: actions/download-artifact@v4
        with:
          name: block-2f-release-evidence
          path: .artifacts/imports/2f
      - name: Download Block 2G evidence
        uses: actions/download-artifact@v4
        with:
          name: block-2g-commercial-evidence
          path: .artifacts/imports/2g
      - name: Download Block 2H static evidence
        uses: actions/download-artifact@v4
        with:
          name: block-2h-static-evidence
          path: .artifacts/block18
      - name: Final deployed release verification
        run: pnpm block18:verify
      - name: Generate immutable release attestation
        run: pnpm block18:evidence
      - name: Upload Block 2H launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block-2h-launch-evidence
          path: .artifacts/block18/
          if-no-files-found: error
