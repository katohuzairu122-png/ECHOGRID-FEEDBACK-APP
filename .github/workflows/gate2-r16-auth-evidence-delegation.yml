name: Gate 2 R16 offline authentication evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate2-r16-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Offline signed actor evidence and delegation test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert no live credential references
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/api/scripts/gate2-r16-auth-evidence-delegation.test.mjs
          ! grep -Eq 'process\.env\.(DATABASE_URL|HYPERDRIVE|STRIPE_SECRET_KEY|JWT_ACCESS_SECRET|CUSTOMER_JWT_SECRET)' apps/api/scripts/gate2-r16-auth-evidence-delegation.test.mjs
      - name: Run evidence verification and delegation denial
        run: node --test apps/api/scripts/gate2-r16-auth-evidence-delegation.test.mjs
