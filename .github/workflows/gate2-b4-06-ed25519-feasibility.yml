name: Gate 2 B4-06 disposable PG18 Ed25519 verifier feasibility
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gate2-b406-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: PG18 Ed25519 fail-closed nonowner boundary
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: echogrid
          POSTGRES_PASSWORD: echogrid
          POSTGRES_DB: echogrid_ci_pg18_b406
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://echogrid:echogrid@localhost:5432/echogrid_ci_pg18_b406
      GATE2_B406_DISPOSABLE: ACK_DISPOSABLE_PG18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Guard disposable PG18 identity
        shell: bash
        run: |
          set -euo pipefail
          test "$DATABASE_URL" = 'postgresql://echogrid:echogrid@localhost:5432/echogrid_ci_pg18_b406'
          test "$GATE2_B406_DISPOSABLE" = 'ACK_DISPOSABLE_PG18'
          test "$(PGPASSWORD=echogrid psql -h localhost -U echogrid -d echogrid_ci_pg18_b406 -Atc "SELECT current_setting('server_version_num')::int / 10000")" = 18
      - name: Verify migration chain
        run: pnpm --filter @echo-grid-feedback/api db:check
      - name: Replay migrations only on disposable PostgreSQL 18
        run: pnpm --filter @echo-grid-feedback/api db:migrate
      - name: Confirm no unapproved database Ed25519 verification authority
        working-directory: apps/api
        run: node scripts/gate2-b4-06-disposable-ed25519-feasibility.mjs
