name: W4 browser acceptance
on:
  push:
    branches: [verify/w4-browser-acceptance]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/w4-browser-acceptance.yml'
      - 'apps/web/playwright.w4.config.ts'
      - 'apps/web/w4-acceptance/**'
      - 'apps/web/src/components/workspace/**'
      - 'apps/web/src/app/signup/**'
      - 'apps/web/src/app/dashboard/feedback/**'
      - 'apps/web/src/app/dashboard/branches/**'
      - 'apps/web/src/components/ui/dialog.tsx'
      - 'apps/web/src/app/loyalty/dashboard/*/messages/**'
      - 'apps/web/messages/*/feedback.json'
      - 'apps/web/messages/*/loyalty.json'
      - 'apps/web/messages/*/common.json'
      - 'apps/web/messages/*/auth.json'
      - 'apps/web/messages/*/branches.json'
      - 'apps/web/messages/*/dashboard.json'
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: echogrid
          POSTGRES_PASSWORD: echogrid
          POSTGRES_DB: echogrid_w4_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://echogrid:echogrid@localhost:5432/echogrid_w4_test
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://echogrid:echogrid@localhost:5432/echogrid_w4_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact revision
        run: git rev-parse HEAD
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @echo-grid-feedback/api db:migrate
      - run: pnpm --filter @echo-grid-feedback/api db:seed
      - run: cp apps/api/.dev.vars.example apps/api/.dev.vars
      - run: pnpm --filter @echo-grid-feedback/api build
      - run: pnpm --filter @echo-grid-feedback/web build
      - run: pnpm --filter @echo-grid-feedback/web exec playwright install --with-deps chromium
      - run: pnpm --filter @echo-grid-feedback/web exec playwright test --config playwright.w4.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w4-browser-evidence
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
