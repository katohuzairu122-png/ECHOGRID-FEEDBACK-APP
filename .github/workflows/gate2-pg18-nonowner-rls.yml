name: Gate 2 PG18 nonowner RLS boundary
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate2-pg18-r5-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Nonowner tenant RLS and restricted role audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: echogrid
          POSTGRES_PASSWORD: echogrid
          POSTGRES_DB: echogrid_ci_pg18_security
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://echogrid:echogrid@localhost:5432/echogrid_ci_pg18_security
      GATE2_R5_DISPOSABLE: I_ACKNOWLEDGE_DISPOSABLE_PG18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Guard disposable PostgreSQL 18 target
        shell: bash
        run: |
          set -euo pipefail
          test "$DATABASE_URL" = 'postgresql://echogrid:echogrid@localhost:5432/echogrid_ci_pg18_security'
          test "$GATE2_R5_DISPOSABLE" = I_ACKNOWLEDGE_DISPOSABLE_PG18
          test "$(PGPASSWORD=echogrid psql -h localhost -U echogrid -d echogrid_ci_pg18_security -Atc "SELECT current_setting('server_version_num')::int / 10000")" = 18
      - name: Verify migration journal
        run: pnpm --filter @echo-grid-feedback/api db:check
      - name: Replay all 72 migrations on disposable PostgreSQL 18
        run: pnpm --filter @echo-grid-feedback/api db:migrate
      - name: Verify effective nonowner grants and tenant RLS
        working-directory: apps/api
        run: node scripts/verify-gate2-pg18-nonowner-rls.mjs
