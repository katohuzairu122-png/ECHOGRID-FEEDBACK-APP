name: S08-DEV-04 baseline audit
on:
  push:
    branches: [feat/s08-dev-04-aggregate-allocation]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9775ead06ec6a720fca64859786cc6a51f9876e0
          persist-credentials: false
      - name: Verify authoritative baseline and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9775ead06ec6a720fca64859786cc6a51f9876e0"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
          echo S08_DEV_04_BASELINE_WORKTREE_CLEAN
          git ls-files '*AGENTS.md'
