name: Gate 2 R9 disposable runtime role contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate2-r9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: PG18 least privilege negative-capability contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: echogrid
          POSTGRES_PASSWORD: echogrid
          POSTGRES_DB: echogrid_ci_pg18_role_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://echogrid:echogrid@localhost:5432/echogrid_ci_pg18_role_contract
      GATE2_R9_DISPOSABLE: I_ACKNOWLEDGE_DISPOSABLE_PG18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Guard local ephemeral PG18 identity
        shell: bash
        run: |
          set -euo pipefail
          test "$DATABASE_URL" = 'postgresql://echogrid:echogrid@localhost:5432/echogrid_ci_pg18_role_contract'
          test "$GATE2_R9_DISPOSABLE" = 'I_ACKNOWLEDGE_DISPOSABLE_PG18'
          test "$(PGPASSWORD=echogrid psql -h localhost -U echogrid -d echogrid_ci_pg18_role_contract -Atc "SELECT current_setting('server_version_num')::int / 10000")" = 18
      - name: Verify migration journal
        run: pnpm --filter @echo-grid-feedback/api db:check
      - name: Replay committed migrations only in disposable PostgreSQL 18
        run: pnpm --filter @echo-grid-feedback/api db:migrate
      - name: Assert default-denied runtime login and explicit RLS blockers
        working-directory: apps/api
        run: node scripts/gate2-r9-runtime-role-contract.mjs
