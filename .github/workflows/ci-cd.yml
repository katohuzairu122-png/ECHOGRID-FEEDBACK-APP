name: CI/CD

# Runs on every push/PR (verify only) and deploys both apps on push to main
# (verify must pass first).
#
# MIGRATIONS: still deliberately NOT run against any real database. pnpm
# db:migrate has no down-migration/rollback tooling wired up (see
# docs/DEPLOYMENT.md's Rollback section), so an unreviewed schema change
# firing automatically on every merge against production stays a risk this
# project isn't taking. That policy is unchanged.
#
# What the verify job now does migrate is an EMPTY, EPHEMERAL postgres
# service container that exists for the life of one job and is discarded
# with it. There is nothing in it to roll back and nothing to lose, so the
# rollback objection does not apply. It exists so the integration suite --
# which holds every transactional money invariant in the platform and which
# CI previously did not run at all -- actually gates a merge. Do not read
# the migrate step below as the production policy having been relaxed.
#
# Prerequisites this workflow assumes but cannot set up itself:
#   1. This repo is pushed to GitHub (it isn't yet as of this commit).
#   2. Two repository secrets exist: Settings -> Secrets and variables ->
#      Actions -> New repository secret:
#        CLOUDFLARE_API_TOKEN   -- Cloudflare dashboard -> My Profile ->
#                                  API Tokens -> Create Token -> "Edit
#                                  Cloudflare Workers" template
#        CLOUDFLARE_ACCOUNT_ID  -- Cloudflare dashboard -> Workers & Pages ->
#                                  Account ID (right sidebar)
#      Until both exist, the deploy jobs below will fail authentication.
#   3. wrangler.toml's placeholder Hyperdrive/KV IDs are already real (see
#      docs/DEPLOYMENT.md Step 1) and all 10 secrets are already set via
#      `wrangler secret put` (Step 2-3) -- this workflow deploys CODE, it
#      does not provision resources or set application secrets.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per branch at a time.
#
# cancel-in-progress is deliberately conditional. Superseding a PR run is
# free -- the older commit's result is no longer interesting. Superseding a
# PUSH TO MAIN is not: a cancel landing between deploy-api and deploy-web
# leaves the API on new code and the frontend on old, which is the exact
# split this workflow's build gate below exists to prevent. So main pushes
# queue and each completes; only PR runs get cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    # The integration tier adds a few minutes; 20 bounds a hung job instead
    # of letting it sit on GitHub's 6-hour default.
    timeout-minutes: 20

    services:
      # Pinned to 16 to match the Neon compute this schema actually runs on.
      # Confirm with `SELECT version()` against Neon before bumping -- a CI
      # container on a different major than production can green-light
      # behaviour that differs there (planner choices, and anything touching
      # collation or JSON functions most of all).
      postgres:
        image: postgres:16
        env:
          # Not secrets. This container is reachable only from this job's
          # network namespace, holds nothing but throwaway fixtures, and is
          # destroyed when the job ends. Moving these into repository
          # secrets would add ceremony and hide what the job connects to.
          POSTGRES_USER: echogrid
          POSTGRES_PASSWORD: echogrid
          POSTGRES_DB: echogrid_test
        ports:
          - 5432:5432
        # Without a healthcheck, steps start the instant the container is
        # created and race Postgres' own init, which fails intermittently
        # rather than cleanly.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Job-scoped so the migrate, seed and integration steps all see it. No
    # sslmode parameter on purpose: the service container terminates plain
    # TCP, and `pg` only negotiates TLS when asked. The db:check step below
    # also inherits this and is unaffected -- drizzle-kit generate diffs
    # against the snapshot files and never opens a connection (see that
    # script's header).
    env:
      DATABASE_URL: postgresql://echogrid:echogrid@localhost:5432/echogrid_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # First real check on purpose: it is the cheapest one here (no database,
      # no compile) and it catches the one failure class the rest of this job
      # is blind to. Typecheck and the unit tests both pass happily when a
      # schema change has no migration -- the tests use fake repositories and
      # never touch Postgres -- which is exactly how Block 7 reached
      # production with a missing migration. See the script's header.
      - name: Migrations up to date -- API
        run: pnpm --filter @echo-grid-feedback/api db:check

      # Defined in package.json since the repo was set up and never run by
      # anything, which is how apps/api/scripts/*.mjs accumulated `no-undef`
      # errors nobody saw (fixed in eslint.config.js in this same change).
      #
      # Note what this does and does not gate: no-unused-vars,
      # consistent-type-imports and no-console are all WARN level in
      # eslint.config.js, so `eslint .` exits 0 on them and they will not
      # fail a build. Only error-level rules do. Promoting any of those to
      # error is a separate decision with its own cleanup.
      - name: Lint
        run: pnpm lint

      - name: Typecheck API
        run: pnpm --filter @echo-grid-feedback/api typecheck

      - name: Typecheck web
        run: pnpm --filter @echo-grid-feedback/web typecheck

      - name: Unit tests -- API
        # Fast tier (fake repositories, no external deps) -- runs before the
        # integration tier below so a logic error reports in seconds rather
        # than after a database spin-up.
        #
        # test:workers is still not here. It runs under Miniflare against
        # this project's own wrangler.toml, whose Hyperdrive binding has no
        # localConnectionString (deliberately -- that file is tracked, see
        # its comment), so the Workers tier cannot reach a database at all.
        # The service container above makes that solvable now, via
        # wrangler's local-connection-string override, but it needs
        # verifying against this wrangler version first -- own change.
        run: pnpm --filter @echo-grid-feedback/api test

      - name: Unit tests -- web
        run: pnpm --filter @echo-grid-feedback/web test

      # ---- integration tier -------------------------------------------
      # After the fast tier and before the builds. It was last when it
      # arrived; measurement moved it -- the whole tier costs 28 seconds in
      # CI against the service container (against remote Neon it is minutes,
      # which is what made it look expensive), so the two build steps below
      # are now the slowest thing in this job and belong after it.
      #
      # Still the only step needing a database, so everything above it
      # reports without one.
      #
      # Applies all 22 migrations to the empty service container from
      # scratch. This doubles as a real check that the migration chain is
      # replayable end-to-end on a fresh database -- db:check only proves
      # drizzle/ matches src/db/schema/, not that the SQL actually runs in
      # order. A migration that only works against an already-populated
      # database fails here.
      - name: Apply migrations -- ephemeral CI database
        run: pnpm --filter @echo-grid-feedback/api db:migrate

      # The permission catalog is platform-defined, not tenant-created, and
      # RoleProvisioningService.seedDefaultRoles resolves role grants
      # against it -- so permission-resolution and billing-permissions both
      # fail on an unseeded database. Only this seed is needed: the others
      # bootstrap a platform admin, a plan catalog, or backfill existing
      # businesses, and no integration test touches any of those.
      - name: Seed permission catalog
        run: pnpm --filter @echo-grid-feedback/api db:seed

      - name: Integration tests -- API (real Postgres)
        run: pnpm --filter @echo-grid-feedback/api test:integration

      # ---- build gate ---------------------------------------------------
      # The gap this closes: deploy-api ran as soon as verify passed, and
      # deploy-web only discovered a broken build afterwards -- leaving a
      # live API on new code and a live frontend on old, with nothing in the
      # pipeline that could have caught it. Building both here means neither
      # deploys unless both compile.
      #
      # Last in the job, after the 28-second integration tier: these are the
      # slowest steps, and a compile error is the failure class every check
      # above is already more likely to surface first.
      - name: Build API (wrangler dry run)
        run: pnpm --filter @echo-grid-feedback/api build

      # `next build`, which is what apps/web's build script runs. Worth being
      # precise about the residual gap: deploy-web runs
      # `opennextjs-cloudflare build`, a further packaging step on top of
      # this one, so an OpenNext-specific packaging failure still lands after
      # deploy-api has shipped. Closing that completely means running the
      # OpenNext build here too, which roughly doubles this job again --
      # deliberately not taken, since compile and type errors are the failure
      # class that actually occurs and this catches them.
      - name: Build web (next build)
        run: pnpm --filter @echo-grid-feedback/web build

  deploy-api:
    name: Deploy API to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # A wrangler deploy that hangs should fail, not occupy a runner for six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy

  deploy-web:
    name: Deploy web to Cloudflare Workers (OpenNext)
    runs-on: ubuntu-latest
    # Depends on deploy-api, not just verify -- docs/DEPLOYMENT.md's Step 6
    # deploys API before web on purpose (web calls the API at build/runtime;
    # deploying web first would briefly point it at a stale API version).
    needs: [verify, deploy-api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # A wrangler deploy that hangs should fail, not occupy a runner for six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy
        # apps/web's deploy script (opennextjs-cloudflare build && deploy)
        # wraps its own wrangler invocation rather than calling `wrangler
        # deploy` directly, so this runs the pnpm script as a plain step
        # instead of going through wrangler-action -- Wrangler picks up
        # CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID from the environment
        # automatically (confirmed against Cloudflare's own CI/CD docs,
        # 2026-07-11), no extra flags needed.
        working-directory: apps/web
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
