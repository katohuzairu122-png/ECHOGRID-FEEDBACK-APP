name: CI/CD

# Runs on every push/PR (verify only) and deploys both apps on push to main
# (verify must pass first). Deliberately does NOT run database migrations --
# pnpm db:migrate has no down-migration/rollback tooling wired up (see
# docs/DEPLOYMENT.md's Rollback section), so an unreviewed schema change
# firing automatically on every merge is a real risk this project isn't
# ready to take on yet. Migrations stay a manual, deliberate step.
#
# Prerequisites this workflow assumes but cannot set up itself:
#   1. This repo is pushed to GitHub (it isn't yet as of this commit).
#   2. Two repository secrets exist: Settings -> Secrets and variables ->
#      Actions -> New repository secret:
#        CLOUDFLARE_API_TOKEN   -- Cloudflare dashboard -> My Profile ->
#                                  API Tokens -> Create Token -> "Edit
#                                  Cloudflare Workers" template
#        CLOUDFLARE_ACCOUNT_ID  -- Cloudflare dashboard -> Workers & Pages ->
#                                  Account ID (right sidebar)
#      Until both exist, the deploy jobs below will fail authentication.
#   3. wrangler.toml's placeholder Hyperdrive/KV IDs are already real (see
#      docs/DEPLOYMENT.md Step 1) and all 10 secrets are already set via
#      `wrangler secret put` (Step 2-3) -- this workflow deploys CODE, it
#      does not provision resources or set application secrets.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck API
        run: pnpm --filter @echo-grid-feedback/api typecheck

      - name: Typecheck web
        run: pnpm --filter @echo-grid-feedback/web typecheck

      - name: Unit tests -- API
        # Fast tier only (fake repositories, no external deps) -- deliberately
        # NOT test:integration (needs a real Postgres) or test:workers (needs
        # real Cloudflare binding IDs, which CI doesn't have). Both stay
        # manual/local per docs/SETUP.md's Testing section.
        run: pnpm --filter @echo-grid-feedback/api test

      - name: Unit tests -- web
        run: pnpm --filter @echo-grid-feedback/web test

  deploy-api:
    name: Deploy API to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy

  deploy-web:
    name: Deploy web to Cloudflare Workers (OpenNext)
    runs-on: ubuntu-latest
    # Depends on deploy-api, not just verify -- docs/DEPLOYMENT.md's Step 6
    # deploys API before web on purpose (web calls the API at build/runtime;
    # deploying web first would briefly point it at a stale API version).
    needs: [verify, deploy-api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy
        # apps/web's deploy script (opennextjs-cloudflare build && deploy)
        # wraps its own wrangler invocation rather than calling `wrangler
        # deploy` directly, so this runs the pnpm script as a plain step
        # instead of going through wrangler-action -- Wrangler picks up
        # CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID from the environment
        # automatically (confirmed against Cloudflare's own CI/CD docs,
        # 2026-07-11), no extra flags needed.
        working-directory: apps/web
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
