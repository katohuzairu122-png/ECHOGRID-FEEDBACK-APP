name: Gate 2 R14 offline trusted issuer invocation contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate2-r14-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Offline issuer trust boundary negative-capability checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure standalone offline harness and no credential access
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/api/scripts/gate2-r14-issuer-invocation.test.mjs
          ! grep -Eq 'process\.env\.(DATABASE_URL|HYPERDRIVE|STRIPE_SECRET_KEY|JWT_ACCESS_SECRET)' apps/api/scripts/gate2-r14-issuer-invocation.test.mjs
      - name: Run offline issuer invocation boundary assertions
        run: node --test apps/api/scripts/gate2-r14-issuer-invocation.test.mjs
