name: Gate 2 staging connection target read-only preflight
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit SHA
        required: true
        type: string
      confirmation:
        description: Type VERIFY_STAGING_TARGET to run read-only checks only
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gate2-staging-secret-preflight
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    name: Staging DB target and journal — no writes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      GATE2_STAGING_PREFLIGHT: VERIFY_STAGING_TARGET
    steps:
      - name: Check exact main SHA and manual acknowledgement
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$CONFIRMATION" = 'VERIFY_STAGING_TARGET'
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          test "$GITHUB_REF" = 'refs/heads/main'
          test -n "$DATABASE_URL"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify repository migration chain without connecting to database
        run: pnpm --filter @echo-grid-feedback/api db:check
      - name: Run read-only connection and exact journal preflight
        working-directory: apps/api
        run: node scripts/gate2-staging-secret-readonly-preflight.mjs
