name: Gate 2 R18 disposable PostgreSQL revocation race
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gate2-r18-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: PostgreSQL 18 durable revocation concurrency proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: echogrid
          POSTGRES_PASSWORD: echogrid
          POSTGRES_DB: echogrid_ci_pg18_revocation
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://echogrid:echogrid@localhost:5432/echogrid_ci_pg18_revocation
      GATE2_R18_DISPOSABLE: I_ACKNOWLEDGE_DISPOSABLE_PG18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify isolated database identity
        shell: bash
        run: |
          set -euo pipefail
          test "$DATABASE_URL" = 'postgresql://echogrid:echogrid@localhost:5432/echogrid_ci_pg18_revocation'
          test "$GATE2_R18_DISPOSABLE" = 'I_ACKNOWLEDGE_DISPOSABLE_PG18'
          test "$(PGPASSWORD=echogrid psql -h localhost -U echogrid -d echogrid_ci_pg18_revocation -Atc "SELECT current_setting('server_version_num')::int / 10000")" = 18
      - name: Test durable transaction serialization against revoked sessions
        working-directory: apps/api
        run: node scripts/gate2-r18-disposable-revocation-race.mjs
